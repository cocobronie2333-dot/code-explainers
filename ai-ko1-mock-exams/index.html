<script id="exam-data" type="application/json">
[
  {
    "name": "排序与因果 Attention",
    "minutes": 60,
    "questions": [
      {
        "title": "积分榜",
        "task": "比赛记录由选手编号和本次得分组成。同一选手可以出现多次。统计每位选手的总分和记录条数，按总分降序排名。总分相同时，记录条数多的在前。仍相同时，编号小的在前。",
        "input": [
          "第一行是 n 和 k，分别表示记录条数和要输出的人数。",
          "随后 n 行，每行是选手编号 id 和本次得分 score。"
        ],
        "output": "按排名输出前 min(k, 参赛人数) 名。每行依次输出编号、总分、记录条数，用一个空格分隔。k=0 时输出为空。",
        "limits": "1 ≤ n ≤ 2×10⁵，0 ≤ k ≤ n，1 ≤ id ≤ 10⁹，−10⁹ ≤ score ≤ 10⁹。",
        "sampleIn": "7 4\n3 10\n1 5\n2 10\n1 5\n3 -2\n4 8\n5 7",
        "sampleOut": "1 10 2\n2 10 1\n3 8 2\n4 8 1",
        "note": "选手 1 和 2 同为 10 分，选手 1 有两条记录，因此排在选手 2 前。",
        "rubric": [
          "统计每个选手的总分和条数。",
          "两层并列规则都正确，并能处理负分。",
          "输出人数和格式符合题意，排序复杂度满足数据规模。"
        ],
        "solution": "import sys\n\ndef main():\n    read = sys.stdin.buffer.readline\n    n, k = map(int, read().split())\n    stats = {}\n    for _ in range(n):\n        player, score = map(int, read().split())\n        total, count = stats.get(player, (0, 0))\n        stats[player] = (total + score, count + 1)\n\n    ranking = sorted(stats, key=lambda player: (\n        -stats[player][0], -stats[player][1], player\n    ))\n    for player in ranking[:k]:\n        print(player, *stats[player])\n\nif __name__ == \"__main__\":\n    main()",
        "checks": [
          [
            "4 4\n5 -5\n2 -5\n5 0\n7 -9",
            "5 -5 2\n2 -5 1\n7 -9 1"
          ],
          [
            "1 0\n9 20",
            ""
          ]
        ],
        "numeric": false
      },
      {
        "title": "单头因果 Attention",
        "task": "给定 Q、K 和 V。对位置 i，只允许关注下标 j ≤ i 的位置。允许位置的分数为 Q[i] 与 K[j] 的点积除以 √d，沿 j 做 Softmax 得到权重，再用权重加权求和 V[j]。",
        "input": [
          "第一行是 t、d 和 dv。",
          "接下来 t 行是 Q，每行 d 个数。再接下来 t 行是 K，每行 d 个数。最后 t 行是 V，每行 dv 个数。"
        ],
        "output": "输出 t 行，每行 dv 个数，保留 6 位小数。实现应能处理较大的正负分数。",
        "limits": "1 ≤ t ≤ 300，1 ≤ d, dv ≤ 64。矩阵元素为有限实数，绝对值不超过 10³。",
        "sampleIn": "3 1 2\n1\n1\n0\n0\n1\n2\n2 0\n6 4\n10 8",
        "sampleOut": "2.000000 0.000000\n4.924234 2.924234\n6.000000 4.000000",
        "note": "最后一行 Q 为 0，三个允许位置的分数相等，因此输出三个 V 向量的平均值。",
        "rubric": [
          "矩阵乘法、缩放和输出 shape 正确。",
          "因果遮罩正确，Softmax 按 key 轴计算且数值稳定。",
          "加权求和和输出精度正确。"
        ],
        "solution": "import sys\nimport numpy as np\n\ndef main():\n    read = sys.stdin.buffer.readline\n    t, d, dv = map(int, read().split())\n    q = np.array([list(map(float, read().split())) for _ in range(t)])\n    k = np.array([list(map(float, read().split())) for _ in range(t)])\n    v = np.array([list(map(float, read().split())) for _ in range(t)])\n\n    scores = (q @ k.T) / np.sqrt(d)\n    pos = np.arange(t)\n    allowed = pos[:, None] >= pos[None, :]\n    scores = np.where(allowed, scores, -np.inf)\n\n    weights = np.exp(scores - scores.max(axis=-1, keepdims=True))\n    weights /= weights.sum(axis=-1, keepdims=True)\n    for row in weights @ v:\n        print(\" \".join(f\"{x:.6f}\" for x in row))\n\nif __name__ == \"__main__\":\n    main()",
        "checks": [
          [
            "2 1 1\n1000\n1000\n1000\n-1000\n7\n9",
            "7.000000\n7.000000"
          ],
          [
            "1 2 2\n1 2\n3 4\n5 6",
            "5.000000 6.000000"
          ]
        ],
        "numeric": true
      }
    ]
  },
  {
    "name": "前缀和与候选采样",
    "minutes": 65,
    "questions": [
      {
        "title": "最长目标和区间",
        "task": "给定整数数组，找出和恰好为 k 的最长非空连续区间。若有多个最长区间，选择左端点最小的一个。",
        "input": [
          "第一行是 n 和 k。",
          "随后是 n 个整数，可分布在一行或多行。"
        ],
        "output": "输出三个整数，依次为最大长度、左端点、右端点。端点从 1 开始且都包含。无解时输出 0 -1 -1。",
        "limits": "1 ≤ n ≤ 2×10⁵，数组元素和 k 的绝对值不超过 10⁹。",
        "sampleIn": "8 3\n1 -1 3 2 -2 3 -3 1",
        "sampleOut": "7 1 7",
        "note": "区间 [1,7] 和 [2,8] 的和都为 3，长度同为 7，选左端点较小者。",
        "rubric": [
          "正确处理负数和从第一个元素开始的区间。",
          "返回最长区间及最小左端点，无解输出正确。",
          "时间复杂度 O(n)，支持跨行输入。"
        ],
        "solution": "import sys\n\ndef main():\n    values = iter(map(int, sys.stdin.buffer.read().split()))\n    n, target = next(values), next(values)\n    first = {0: 0}\n    prefix = 0\n    best_length, best_left, best_right = 0, -1, -1\n\n    for right in range(1, n + 1):\n        prefix += next(values)\n        previous = first.get(prefix - target)\n        if previous is not None:\n            length = right - previous\n            left = previous + 1\n            if length > best_length or (\n                length == best_length and left \u003c best_left\n            ):\n                best_length, best_left, best_right = length, left, right\n        first.setdefault(prefix, right)\n\n    print(best_length, best_left, best_right)\n\nif __name__ == \"__main__\":\n    main()",
        "checks": [
          [
            "3 0\n0\n0 0",
            "3 1 3"
          ],
          [
            "2 3\n1 1",
            "0 -1 -1"
          ],
          [
            "1 -2\n-2",
            "1 1 1"
          ]
        ],
        "numeric": false
      },
      {
        "title": "Temperature、Top-k 与 Top-p",
        "task": "给定按 token ID 排列的一维 logits，以及一个模拟随机数 u。先按 logits 从高到低选前 k 个候选，同分时 ID 小的在前。仅对这 k 项按 Softmax(logit / T) 求概率，再按候选顺序保留累计概率首次达到或超过 p 的最短前缀。p=1 时保留全部 k 项。将保留项概率重新归一化，选择累计概率第一次严格大于 u 的候选作为抽样结果。",
        "input": [
          "第一行是 n、k、T、p、u。",
          "第二行是 n 个 logits，对应编号 0 到 n−1。"
        ],
        "output": "第一行输出保留候选数。第二行按候选顺序输出保留的 token ID。第三行输出抽到的原 token ID。",
        "limits": "1 ≤ k ≤ n ≤ 10⁵，0.01 ≤ T ≤ 100，0 \u003c p ≤ 1，0 ≤ u \u003c 1，logits 为绝对值不超过 10⁴ 的有限实数。",
        "sampleIn": "5 3 1 0.7 0.5\n0 2 1 -1 2",
        "sampleOut": "2\n1 4\n4",
        "note": "候选顺序为 1、4、2。Top-p 只保留前两个，重新归一化后均为 0.5。u=0.5，因为要求累计概率严格大于 u，选 ID 4。",
        "rubric": [
          "正确处理同分、温度和 Top-k 内归一化。",
          "Top-p 保留跨过阈值的项，正确处理 p=1。",
          "截断后重归一化，严格大于 u 并返回原 ID。"
        ],
        "solution": "import sys\nimport numpy as np\n\ndef main():\n    read = sys.stdin.buffer.readline\n    n_text, k_text, t_text, p_text, u_text = read().split()\n    n, k = int(n_text), int(k_text)\n    temperature, p, u = map(float, (t_text, p_text, u_text))\n    logits = np.fromiter(map(float, read().split()), dtype=float, count=n)\n\n    ids = np.argsort(-logits, kind=\"stable\")[:k]\n    scores = (logits[ids] - logits[ids[0]]) / temperature\n    weights = np.exp(scores)\n    probs = weights / weights.sum()\n\n    end = k\n    if p \u003c 1.0:\n        end = min(k, np.searchsorted(np.cumsum(probs), p, side=\"left\") + 1)\n    ids, weights = ids[:end], weights[:end]\n    cdf = np.cumsum(weights)\n    cdf /= cdf[-1]\n    selected = np.searchsorted(cdf, u, side=\"right\")\n\n    print(end)\n    print(*ids)\n    print(ids[selected])\n\nif __name__ == \"__main__\":\n    main()",
        "checks": [
          [
            "4 4 1 0.5 0\n9 9 9 9",
            "2\n0 1\n0"
          ],
          [
            "3 2 2 1 0.8\n3 1 0",
            "2\n0 1\n1"
          ],
          [
            "1 1 0.01 1 0.999\n-10000",
            "1\n0\n0"
          ]
        ],
        "numeric": false
      }
    ]
  },
  {
    "name": "最短路与训练更新",
    "minutes": 75,
    "questions": [
      {
        "title": "最短路线计数",
        "task": "网格中有唯一的起点 S 和终点 E。可向上、下、左、右移动一步，不能越界或进入障碍 #。求最少步数和达到该步数的不同路线数。路线以经过的格子序列区分。",
        "input": [
          "第一行是 r 和 c，表示网格行数和列数。",
          "随后 r 行，每行恰有 c 个字符，字符为 S、E、. 或 #。"
        ],
        "output": "输出最少步数和最短路线数，路线数对 1 000 000 007 取模。不可达时输出 -1 0。",
        "limits": "1 ≤ r, c ≤ 600，2 ≤ r×c ≤ 2×10⁵。",
        "sampleIn": "3 4\nS...\n.#..\n...E",
        "sampleOut": "5 4",
        "note": "任一最短路线都走 5 步，避开障碍后共有 4 条。",
        "rubric": [
          "用 BFS 得到最短距离，正确处理不可达。",
          "首次到达记录方案数，同一最短距离的后续到达累加方案数。",

<script>
"use strict";

const exams = JSON.parse(document.getElementById("exam-data").textContent);
const storageKey = "ai-ko1-mock-exams-5-v1";
const byId = id => document.getElementById(id);
let saved;
try {
  saved = JSON.parse(localStorage.getItem(storageKey));
} catch {
  saved = null;
}
const state = saved && saved.papers?.length === exams.length ? saved : {
  current: 0,
  papers: exams.map(() => ({ startedAt: null, submittedAt: null, code: ["", ""] }))
};
const dialog = byId("submit-dialog");
let pendingPaper = null;

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch {
    byId("persistence-note").textContent = "浏览器存储不可用，请下载代码保留答题记录。";
  }
}

function item(tag, className, value) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (value !== undefined) element.textContent = value;
  return element;
}

function remaining(index) {
  const paper = state.papers[index];
  const duration = exams[index].minutes * 60;
  if (paper.startedAt === null) return duration;
  const end = paper.submittedAt ?? Date.now();
  return Math.max(0, duration - Math.floor((end - paper.startedAt) / 1000));
}

function paperStatus(index) {
  const paper = state.papers[index];
  if (paper.submittedAt !== null) return "已交卷";
  if (paper.startedAt !== null) return remaining(index) === 0 ? "时间到" : "计时中";
  return paper.code.some(code => code.trim()) ? "有草稿" : "未开始";
}

function renderNav() {
  byId("exam-list").replaceChildren(...exams.map((exam, index) => {
    const button = item("button", "exam-tab");
    button.type = "button";
    button.setAttribute("aria-current", String(index === state.current));
    button.append(
      item("span", "tab-title", "第 " + (index + 1) + " 套 · " + exam.name),
      item("small", "", exam.minutes + " 分钟 · " + paperStatus(index))
    );
    button.addEventListener("click", () => {
      if (index === state.current) return;
      state.current = index;
      save();
      render();
      byId("paper-title").focus();
    });
    return button;
  }));
}

function updateClock() {
  const index = state.current;
  const paper = state.papers[index];
  const left = remaining(index);
  const mm = String(Math.floor(left / 60)).padStart(2, "0");
  const ss = String(left % 60).padStart(2, "0");
  byId("timer").textContent = mm + ":" + ss;
  byId("timer").classList.toggle("expired", left === 0 && paper.submittedAt === null);
  let caption = "建议用时";
  if (paper.submittedAt !== null) {
    caption = paper.startedAt === null ? "交卷时未计时" : "交卷时剩余";
  } else if (paper.startedAt !== null) {
    caption = left === 0 ? "时间到，可以交卷" : "剩余时间";
  }
  byId("timer-caption").textContent = caption;
  const labels = byId("exam-list").querySelectorAll("small");
  for (const [tab, label] of labels.entries()) {
    const value = exams[tab].minutes + " 分钟 · " + paperStatus(tab);
    if (label.textContent !== value) label.textContent = value;
  }
}

function printSample(input, output) {
  const row = item("div", "sample");
  for (const [label, value] of [["输入", input], ["输出", output]]) {
    const figure = item("figure");
    figure.append(item("figcaption", "", label), item("pre", "", value || "（空）"));
    row.append(figure);
  }
  return row;
}

function downloadCode(examIndex, questionIndex) {
  const code = state.papers[examIndex].code[questionIndex];
  const url = URL.createObjectURL(new Blob([code], { type: "text/x-python;charset=utf-8" }));
  const link = item("a");
  link.href = url;
  link.download = "AI-ko1-" + (examIndex + 1) + "-q" + (questionIndex + 1) + ".py";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function renderSolution(question) {
  const details = item("details", "solution");
  const points = item("ul");
  points.append(...question.rubric.map(point => item("li", "", point)));
  details.append(
    item("summary", "", "参考实现、评分要点和额外用例"),
    points,
    item("pre", "", question.solution)
  );
  for (const [index, [input, output]] of question.checks.entries()) {
    const test = item("details", "test-case");
    test.append(item("summary", "", "额外用例 " + (index + 1)), printSample(input, output));
    details.append(test);
  }
  return details;
}

function renderQuestion(question, index, examIndex) {
  const paper = state.papers[examIndex];
  const article = item("article", "question");
  article.id = "question-" + (index + 1);
  const head = item("div", "question-head");
  const heading = item("h3", "", question.title);
  heading.id = "question-heading-" + (index + 1);
  article.setAttribute("aria-labelledby", heading.id);
  head.append(item("span", "question-kind", index === 0 ? "01 · 通用编程" : "02 · AI 编程"), heading);

  const spec = item("dl", "specification");
  for (const [label, lines] of [
    ["输入格式", question.input],
    ["输出格式", [question.output]],
    ["数据范围", [question.limits]]
  ]) {
    const block = item("div");
    const content = item("dd");
    content.append(...lines.map(line => item("p", "", line)));
    block.append(item("dt", "", label), content);
    spec.append(block);
  }

  const editorId = "code-" + (index + 1);
  const editorHead = item("div", "editor-head");
  const label = item("label", "editor-label", "作答代码");
  label.htmlFor = editorId;
  const download = item("button", "download", "下载 .py");
  download.type = "button";
  download.addEventListener("click", () => downloadCode(examIndex, index));
  editorHead.append(label, download);

  const editor = item("textarea");
  editor.id = editorId;
  editor.spellcheck = false;
  editor.autocapitalize = "off";
  editor.setAttribute("autocomplete", "off");
  editor.setAttribute("wrap", "off");
  editor.value = paper.code[index];
  editor.readOnly = paper.submittedAt !== null;
  download.disabled = !editor.value.trim();
  editor.addEventListener("input", () => {
    paper.code[index] = editor.value;
    download.disabled = !editor.value.trim();
    save();
    updateClock();
  });
  // Let Tab leave the editor so the whole exam remains keyboard accessible.

  article.append(head, item("p", "", question.task), spec,
    printSample(question.sampleIn, question.sampleOut),
    item("p", "sample-note", question.note), editorHead, editor);
  if (paper.submittedAt !== null) article.append(renderSolution(question));
  return article;
}

function render() {
  const index = state.current;
  const exam = exams[index];
  const paper = state.papers[index];
  const submitted = paper.submittedAt !== null;
  const title = byId("paper-title");
  title.textContent = "第 " + (index + 1) + " 套 · " + exam.name;
  title.tabIndex = -1;
  byId("paper-info").textContent = "标准输入输出 · 共 2 题 · 在本地运行代码";
  byId("start-timer").hidden = submitted || paper.startedAt !== null;
  byId("submit-paper").hidden = submitted;
  byId("submission-note").hidden = !submitted;
  byId("questions").replaceChildren(...exam.questions.map((question, qIndex) =>
    renderQuestion(question, qIndex, index)
  ));
  renderNav();
  updateClock();
}

byId("start-timer").addEventListener("click", () => {
  state.papers[state.current].startedAt = Date.now();
  save();
  byId("start-timer").hidden = true;
  byId("code-1").focus({ preventScroll: true });
  updateClock();
});

byId("submit-paper").addEventListener("click", () => {
  pendingPaper = state.current;
  const blanks = state.papers[pendingPaper].code.filter(code => !code.trim()).length;
  byId("submit-message").textContent = (blanks ? "还有 " + blanks + " 道题未填写。 " : "") +
    "交卷后本套试卷会显示参考答案，作答代码会保留。";
  dialog.returnValue = "";
  dialog.showModal();
});

dialog.addEventListener("close", () => {
  if (dialog.returnValue === "submit" && pendingPaper !== null) {
    state.papers[pendingPaper].submittedAt = Date.now();
    save();
    render();
    byId("paper-title").focus();
  }
  pendingPaper = null;
});

save();
render();
setInterval(updateClock, 500);
</script>
</body>
</html>
